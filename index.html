<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生徒データベース検索くん v1.3.2</title>
  <style>
    body { font-family: sans-serif; margin: 8px; background: #1b2e23; color: #e2e8f0; max-width: 650px; margin: 0 auto; padding: 12px; box-sizing: border-box; }
    * { box-sizing: border-box; }
    
    .header-box { text-align: center; margin-bottom: 8px; }
    h2 { font-size: 1.2rem; margin: 0; display: inline-flex; align-items: center; gap: 8px; color: #f8fafc; }
    .version-tag { font-size: 0.7rem; background: #d97706; color: #fff; padding: 2px 8px; border-radius: 10px; font-weight: normal; }
    .sub-desc { text-align: center; font-size: 0.75rem; color: #94a3b8; margin-top: 4px; margin-bottom: 12px; }
    
    /* ユーザーバー（ログイン中表示） */
    .user-bar { display: none; justify-content: space-between; align-items: center; background: #18281e; padding: 6px 12px; border-radius: 6px; border: 1px solid #334e3f; font-size: 0.8rem; margin-bottom: 12px; }
    .user-name { color: #5eead4; font-weight: bold; }
    .logout-btn { background: #475569; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .logout-btn:hover { background: #334155; }

    /* ログイン画面エリア */
    .login-container { background: #23382c; padding: 20px 16px; border-radius: 8px; border: 1px solid #334e3f; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-top: 20px; }
    .login-title { font-weight: bold; font-size: 1rem; color: #f8fafc; text-align: center; margin-bottom: 16px; border-bottom: 2px solid #0d9488; padding-bottom: 6px; }
    .login-field { margin-bottom: 12px; }
    .login-field label { display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 4px; }
    .login-field input { width: 100%; padding: 10px; font-size: 0.95rem; border: 1px solid #475569; border-radius: 4px; background: #18281e; color: #f8fafc; }
    .login-error { color: #f87171; font-size: 0.85rem; margin-top: 10px; text-align: center; font-weight: bold; display: none; padding: 6px; background: rgba(239,68,68,0.1); border-radius: 4px; border: 1px solid #ef4444; }
    .btn-login-submit { width: 100%; background: #0d9488; color: #fff; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 8px; }
    .btn-login-submit:hover { background: #0f766e; }
    .btn-login-submit:disabled { background: #475569; cursor: not-allowed; }

    /* メイン機能エリア（初期は非表示） */
    #mainAppArea { display: none; }

    .card { background: #23382c; padding: 12px; border-radius: 8px; border: 1px solid #334e3f; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); width: 100%; overflow: hidden; }
    .card-title { font-weight: bold; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 8px; border-bottom: 2px solid #0d9488; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .card-title a { color: #5eead4; text-decoration: none; }
    .card-title a:hover { text-decoration: underline; }

    /* フィールド選択チェックボックス */
    .checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; max-height: 140px; overflow-y: auto; padding: 6px; border: 1px solid #334e3f; background: #18281e; border-radius: 4px; }
    .checkbox-label { font-size: 0.8rem; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; color: #cbd5e1; }
    .checkbox-label input[type="checkbox"] { accent-color: #0d9488; }

    /* 入力行 */
    .search-row { display: flex; gap: 6px; margin-top: 8px; width: 100%; }
    input[type="text"], select { width: 100%; min-width: 0; padding: 8px; font-size: 0.9rem; border: 1px solid #475569; border-radius: 4px; background: #18281e; color: #f8fafc; }
    input[type="text"]::placeholder { color: #64748b; }

    /* クラス・番号入力のレイアウト */
    .class-num-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; width: 100%; }
    .class-num-row select { flex: 1 1 100px; min-width: 0; }
    .class-num-row input[type="text"] { flex: 1 1 90px; min-width: 0; }
    .class-num-row input.num-input { flex: 0 1 65px; min-width: 0; }
    .class-num-row button { flex: 0 1 auto; }

    /* ボタンデザイン */
    button.action-btn { background: #0d9488; color: #fff; border: none; padding: 8px 14px; font-size: 0.9rem; font-weight: bold; border-radius: 4px; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
    button.action-btn:hover { background: #0f766e; }
    button.action-btn:active { background: #115e59; }

    button.csv-btn { background: #16a34a; }
    button.csv-btn:hover { background: #15803d; }

    button.copy-btn { background: #475569; font-size: 0.8rem; padding: 6px 12px; }
    button.copy-btn:hover { background: #334155; }
    button.copy-btn.copied { background: #16a34a; }

    /* 検索結果・一覧表示エリア */
    .result-box { background: #23382c; padding: 12px; border-radius: 8px; border: 1px solid #334e3f; display: none; width: 100%; overflow: hidden; }
    .result-item { padding: 8px 0; border-bottom: 1px dashed #334e3f; font-size: 0.9rem; display: flex; flex-direction: column; }
    .result-item:last-child { border-bottom: none; }
    .res-label { font-size: 0.7rem; color: #94a3b8; font-weight: bold; }
    .res-value { font-size: 1rem; color: #f8fafc; word-break: break-all; margin-top: 2px; }
    .error-msg { color: #f87171; font-weight: bold; text-align: center; padding: 10px; font-size: 0.85rem; }

    /* クラス一括検索のテーブル表示 */
    .table-container { overflow-x: auto; margin-top: 8px; border-radius: 4px; border: 1px solid #334e3f; max-width: 100%; }
    table.class-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: #18281e; color: #e2e8f0; }
    table.class-table th, table.class-table td { border: 1px solid #334e3f; padding: 6px 8px; text-align: left; white-space: nowrap; }
    table.class-table th { background: #1f3529; font-weight: bold; color: #5eead4; }
    
    .status-bar { text-align: center; font-size: 0.75rem; color: #94a3b8; margin-bottom: 12px; }
    .result-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0d9488; padding-bottom: 4px; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  </style>
</head>
<body>

  <div class="header-box">
    <h2>🎓 生徒データベース検索くん <span class="version-tag">v1.3.2</span></h2>
  </div>
  <div class="sub-desc">教員専用認証システム ＆ 生徒情報データベース</div>

  <!-- ログイン中の教員バー -->
  <div class="user-bar" id="userBar">
    <span>👤 ログイン中: <span class="user-name" id="userNameLabel"></span> 先生</span>
    <button class="logout-btn" id="logoutBtn">ログアウト</button>
  </div>

  <!-- ログイン入力フォーム -->
  <div class="login-container" id="loginContainer">
    <div class="login-title">🔒 教員認証</div>
    <div class="login-field">
      <label for="loginId">教員ID</label>
      <input type="text" id="loginId" placeholder="例: t101" autocomplete="username">
    </div>
    <div class="login-field">
      <label for="loginPass">パスワード</label>
      <input type="password" id="loginPass" placeholder="パスワードを入力" autocomplete="current-password">
    </div>
    <button class="btn-login-submit" id="loginBtn">ログインして利用開始</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <!-- メイン検索アプリ領域 -->
  <div id="mainAppArea">
    <div class="status-bar" id="statusBar">✅ 認証完了</div>

    <!-- 1. 出力項目選択 -->
    <div class="card">
      <div class="card-title">
        <span>1. 出力・ダウンロードする項目を選択（記憶されます）</span>
        <span style="font-size:0.75rem; font-weight:normal;"><a href="#" id="selectAllBtn">全選択</a> / <a href="#" id="deselectAllBtn">解除</a></span>
      </div>
      <div class="checkbox-group" id="fieldCheckboxes">
        <!-- 動的生成 -->
      </div>
    </div>

    <!-- 2. 個別検索（st番号） -->
    <div class="card">
      <div class="card-title">2. st番号で個別検索</div>
      <div class="search-row">
        <input type="text" id="stInput" placeholder="例: st9826001">
        <button class="action-btn" id="searchStBtn">検索</button>
      </div>
    </div>

    <!-- 2-2. 個別検索（クラス名 ＆ 番号） -->
    <div class="card">
      <div class="card-title">2b. クラス・番号で個別検索</div>
      <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:4px;">対象のクラスフィールドを選び、クラスと番号を入力</div>
      <div class="class-num-row">
        <select id="cardClassFieldSelect">
          <!-- 動的生成 -->
        </select>
        <input type="text" id="cardClassInput" placeholder="M3A">
        <input type="text" id="cardNumInput" class="num-input" placeholder="1">
        <button class="action-btn" id="searchClassNumBtn">検索</button>
      </div>
    </div>

    <!-- 3. クラス別一括検索 ＆ CSV出力 -->
    <div class="card">
      <div class="card-title">3. クラス別一括検索 ＆ CSVダウンロード</div>
      <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:6px;">対象のクラスフィールドとクラス名（例: M3A）を指定</div>
      <div class="search-row">
        <select id="classFieldSelect" style="flex: 1.2;">
          <!-- 動的生成 -->
        </select>
        <input type="text" id="classInput" placeholder="例: M3A" style="flex: 1;">
        <button class="action-btn" id="searchClassBtn">検索</button>
      </div>
    </div>

    <!-- 結果表示エリア -->
    <div class="result-box" id="resultBox">
      <div class="result-header-row">
        <span id="resultTitle" style="font-weight: bold; font-size: 0.85rem; color: #f8fafc;">検索結果</span>
        <div id="resultActionArea"></div>
      </div>
      <div id="resultContent"></div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwzbUMOPgQaGan2cK_illXQ8XQZy3Xf4guG_k1O3F6mLCdNWPIDe9-_bvH4qApQ5JbcMA/exec";
    const STORAGE_KEY_FIELDS = 'student_db_selected_fields_v12';
    const CACHE_KEY_STUDENTS = 'student_db_cache_data_v12';
    const SESSION_KEY_TEACHER = 'student_db_logged_teacher_v12';

    let allHeaders = [];
    let allRows = [];
    let lastSearchResultText = "";

    // イベントリスナーの初期化
    window.addEventListener('DOMContentLoaded', () => {
      // ログインボタン
      document.getElementById('loginBtn').addEventListener('click', executeLogin);
      document.getElementById('loginPass').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') executeLogin();
      });

      // ログアウトボタン
      document.getElementById('logoutBtn').addEventListener('click', logout);

      // 全選択 / 解除
      document.getElementById('selectAllBtn').addEventListener('click', (e) => { e.preventDefault(); selectAll(true); });
      document.getElementById('deselectAllBtn').addEventListener('click', (e) => { e.preventDefault(); selectAll(false); });

      // 検索ボタン群
      document.getElementById('searchStBtn').addEventListener('click', searchStudentBySt);
      document.getElementById('stInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchStudentBySt(); });

      document.getElementById('searchClassNumBtn').addEventListener('click', searchStudentByClassNum);
      document.getElementById('cardClassInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchStudentByClassNum(); });
      document.getElementById('cardNumInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchStudentByClassNum(); });

      document.getElementById('searchClassBtn').addEventListener('click', searchClass);
      document.getElementById('classInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchClass(); });

      // セッション復元チェック
      try {
        const savedTeacher = sessionStorage.getItem(SESSION_KEY_TEACHER);
        const savedData = localStorage.getItem(CACHE_KEY_STUDENTS);
        if (savedTeacher && savedData) {
          const teacherObj = JSON.parse(savedTeacher);
          const parsed = JSON.parse(savedData);
          allHeaders = parsed.headers || [];
          allRows = parsed.rows || [];
          showApp(teacherObj);
          buildFieldCheckboxes();
          buildClassFieldSelects();
        }
      } catch (e) {
        sessionStorage.removeItem(SESSION_KEY_TEACHER);
      }
    });

    // ログイン実行処理
    function executeLogin() {
      const idVal = document.getElementById('loginId').value.trim();
      const passVal = document.getElementById('loginPass').value.trim();
      const errBox = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');

      errBox.style.display = 'none';
      if (!idVal || !passVal) {
        errBox.innerText = '⚠️ 教員IDとパスワードを入力してください。';
        errBox.style.display = 'block';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = '🔄 認証中...';

      // コールバック
      window.handleAppLogin = function(res) {
        loginBtn.disabled = false;
        loginBtn.innerText = 'ログインして利用開始';

        if (res && res.success) {
          allHeaders = res.headers || [];
          allRows = res.rows || [];

          // セッション＆キャッシュ保存
          sessionStorage.setItem(SESSION_KEY_TEACHER, JSON.stringify(res.teacher || { name: '教員' }));
          try {
            localStorage.setItem(CACHE_KEY_STUDENTS, JSON.stringify({ headers: allHeaders, rows: allRows }));
          } catch(e) {}

          showApp(res.teacher || { name: '教員' });
          buildFieldCheckboxes();
          buildClassFieldSelects();
        } else {
          errBox.innerText = res && res.message ? res.message : '⚠️ IDまたはパスワードが正しくありません。';
          errBox.style.display = 'block';
        }
      };

      const script = document.createElement('script');
      script.src = `${GAS_API_URL}?action=login&id=${encodeURIComponent(idVal)}&pass=${encodeURIComponent(passVal)}&callback=handleAppLogin&t=${Date.now()}`;
      script.onerror = function() {
        loginBtn.disabled = false;
        loginBtn.innerText = 'ログインして利用開始';
        errBox.innerText = '⚠️ 通信エラーが発生しました。接続を確認してください。';
        errBox.style.display = 'block';
      };
      document.body.appendChild(script);
    }

    function showApp(teacher) {
      document.getElementById('loginContainer').style.display = 'none';
      document.getElementById('userBar').style.display = 'flex';
      document.getElementById('userNameLabel').innerText = (teacher && teacher.name) ? teacher.name : '教員';
      document.getElementById('mainAppArea').style.display = 'block';
      document.getElementById('statusBar').innerText = `✅ 認証完了（全 ${allRows.length} 件の生徒データ）`;
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY_TEACHER);
      localStorage.removeItem(CACHE_KEY_STUDENTS);
      allHeaders = [];
      allRows = [];
      document.getElementById('loginId').value = '';
      document.getElementById('loginPass').value = '';
      document.getElementById('mainAppArea').style.display = 'none';
      document.getElementById('userBar').style.display = 'none';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('loginContainer').style.display = 'block';
    }

    function formatValue(fieldName, val) {
      if (val === undefined || val === null || val === '') return '';

      // 生年月日などの日付フィールドの整形
      if (fieldName.includes('生年月日') || fieldName.includes('日付') || fieldName.includes('日')) {
        // 1. スプレッドシートのシリアル値（数値）の場合
        if (!isNaN(val) && Number(val) > 30000 && Number(val) < 60000) {
          const excelEpoch = new Date(1899, 11, 30);
          const jsDate = new Date(excelEpoch.getTime() + Number(val) * 24 * 60 * 60 * 1000);
          const y = jsDate.getFullYear();
          const m = String(jsDate.getMonth() + 1).padStart(2, '0');
          const d = String(jsDate.getDate()).padStart(2, '0');
          return `${y}/${m}/${d}`;
        }

        // 2. 日時文字列（ISO文字列や "Sun Dec 23 2012..." など時刻付き文字列）の場合
        const parsedDate = new Date(val);
        if (!isNaN(parsedDate.getTime()) && String(val).length > 7 && !/^\d+$/.test(String(val))) {
          const y = parsedDate.getFullYear();
          const m = String(parsedDate.getMonth() + 1).padStart(2, '0');
          const d = String(parsedDate.getDate()).padStart(2, '0');
          return `${y}/${m}/${d}`;
        }
      }

      return String(val);
    }


    function buildFieldCheckboxes() {
      const container = document.getElementById('fieldCheckboxes');
      container.innerHTML = '';
      if (allHeaders.length === 0) return;

      let savedFields = JSON.parse(localStorage.getItem(STORAGE_KEY_FIELDS));
      if (!savedFields) {
        const currentYearStr = new Date().getFullYear().toString();
        savedFields = allHeaders.filter(h => 
          ['氏名', 'st番号', 'メールアドレス', 'BLENDパス', '在籍状況'].includes(h) || h.includes(currentYearStr)
        );
      }

      allHeaders.forEach(header => {
        const wrapper = document.createElement('label');
        wrapper.className = 'checkbox-label';

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.value = header;
        chk.id = 'chk_' + header;
        chk.checked = savedFields.includes(header);
        chk.onchange = saveSelectedFields;

        wrapper.appendChild(chk);
        wrapper.appendChild(document.createTextNode(header));
        container.appendChild(wrapper);
      });
    }

    function buildClassFieldSelects() {
      let classFields = allHeaders.filter(h => h.includes('クラス'));
      if (classFields.length === 0) classFields = [...allHeaders];
      const currentYearStr = new Date().getFullYear().toString();

      const select1 = document.getElementById('classFieldSelect');
      select1.innerHTML = '';
      classFields.forEach(field => {
        const opt = document.createElement('option');
        opt.value = field;
        opt.innerText = field;
        if (field.includes(currentYearStr)) opt.selected = true;
        select1.appendChild(opt);
      });
      if (!select1.value && select1.options.length > 0) select1.selectedIndex = 0;

      const select2 = document.getElementById('cardClassFieldSelect');
      select2.innerHTML = '';
      classFields.forEach(field => {
        const opt = document.createElement('option');
        opt.value = field;
        opt.innerText = field;
        if (field.includes(currentYearStr)) opt.selected = true;
        select2.appendChild(opt);
      });
      if (!select2.value && select2.options.length > 0) select2.selectedIndex = 0;
    }

    function saveSelectedFields() {
      const checkboxes = document.querySelectorAll('#fieldCheckboxes input[type="checkbox"]');
      const selected = [];
      checkboxes.forEach(chk => { if (chk.checked) selected.push(chk.value); });
      localStorage.setItem(STORAGE_KEY_FIELDS, JSON.stringify(selected));
    }

    function selectAll(checkState) {
      const checkboxes = document.querySelectorAll('#fieldCheckboxes input[type="checkbox"]');
      checkboxes.forEach(chk => chk.checked = checkState);
      saveSelectedFields();
    }

    function getSelectedFields() {
      const checkboxes = document.querySelectorAll('#fieldCheckboxes input[type="checkbox"]');
      const selected = [];
      checkboxes.forEach(chk => { if (chk.checked) selected.push(chk.value); });
      return selected;
    }

    function displayStudentCard(found) {
      const resultBox = document.getElementById('resultBox');
      const resultContent = document.getElementById('resultContent');
      const resultTitle = document.getElementById('resultTitle');
      const resultActionArea = document.getElementById('resultActionArea');

      resultBox.style.display = 'block';
      resultContent.innerHTML = '';
      resultActionArea.innerHTML = '';

      if (!found) {
        resultTitle.innerText = "検索結果：見つかりませんでした";
        resultContent.innerHTML = `<div class="error-msg">該当する生徒は見つかりませんでした。</div>`;
        return;
      }

      const studentName = found['氏名'] || '生徒情報';
      resultTitle.innerText = `検索結果：${studentName} さん`;

      const selectedFields = getSelectedFields();
      let copyTextLines = [];
      let displayedCount = 0;

      selectedFields.forEach(fieldName => {
        const rawValue = found[fieldName];
        const formattedValue = formatValue(fieldName, rawValue);

        const itemDiv = document.createElement('div');
        itemDiv.className = 'result-item';
        itemDiv.innerHTML = `
          <span class="res-label">${fieldName}</span>
          <span class="res-value">${formattedValue !== '' ? escapeHtml(formattedValue) : '<span style="color:#64748b; font-size:0.85rem;">(空欄)</span>'}</span>
        `;
        resultContent.appendChild(itemDiv);
        copyTextLines.push(`${fieldName}: ${formattedValue}`);
        displayedCount++;
      });

      if (displayedCount === 0) {
        resultContent.innerHTML = `<div style="color:#94a3b8; font-size:0.85rem; text-align:center; padding:10px;">出力する項目が選択されていません。</div>`;
        return;
      }

      lastSearchResultText = copyTextLines.join('\n');

      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn copy-btn';
      copyBtn.innerText = '📋 結果をコピー';
      copyBtn.onclick = function() {
        navigator.clipboard.writeText(lastSearchResultText).then(() => {
          copyBtn.innerText = '✅ コピー完了！';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.innerText = '📋 結果をコピー';
            copyBtn.classList.remove('copied');
          }, 2000);
        }).catch(err => {
          alert('コピーに失敗しました');
        });
      };
      resultActionArea.appendChild(copyBtn);
    }

    function searchStudentBySt() {
      const inputVal = document.getElementById('stInput').value.trim().toLowerCase();
      if (!inputVal) { alert('st番号を入力してください'); return; }
      if (allRows.length === 0) { alert('データがありません'); return; }

      const found = allRows.find(row => {
        const stNum = (row['st番号'] || '').toString().trim().toLowerCase();
        return stNum === inputVal;
      });
      displayStudentCard(found);
    }

    function searchStudentByClassNum() {
      const classField = document.getElementById('cardClassFieldSelect').value;
      const classVal = document.getElementById('cardClassInput').value.trim().toLowerCase();
      const numVal = document.getElementById('cardNumInput').value.trim();

      if (!classVal || !numVal) { alert('クラス名と番号の両方を入力してください'); return; }
      if (allRows.length === 0) { alert('データがありません'); return; }

      const prefix = classField.replace('クラス', '');
      const numFieldCandidates = [prefix + '番', prefix + '番号', '番'];
      
      const found = allRows.find(row => {
        const cVal = (row[classField] || '').toString().trim().toLowerCase();
        if (cVal !== classVal) return false;

        for (let nf of numFieldCandidates) {
          if (row[nf] !== undefined) {
            const nVal = (row[nf] || '').toString().trim();
            if (nVal === numVal) return true;
          }
        }
        return Object.keys(row).some(k => k.includes('番') && String(row[k]).trim() === numVal && cVal === classVal);
      });

      displayStudentCard(found);
    }

    function searchClass() {
      const classField = document.getElementById('classFieldSelect').value;
      const classVal = document.getElementById('classInput').value.trim().toLowerCase();
      
      const resultBox = document.getElementById('resultBox');
      const resultContent = document.getElementById('resultContent');
      const resultTitle = document.getElementById('resultTitle');
      const resultActionArea = document.getElementById('resultActionArea');

      if (!classVal) { alert('クラス名を入力してください'); return; }
      if (allRows.length === 0) { alert('データがありません'); return; }

      const matchedRows = allRows.filter(row => {
        const val = (row[classField] || '').toString().trim().toLowerCase();
        return val === classVal;
      });

      resultBox.style.display = 'block';
      resultContent.innerHTML = '';
      resultActionArea.innerHTML = '';

      if (matchedRows.length === 0) {
        resultTitle.innerText = `検索結果：${classField} [${classVal}] (0件)`;
        resultContent.innerHTML = `<div class="error-msg">${classField} が「${classVal}」に該当する生徒は見つかりませんでした。</div>`;
        return;
      }

      resultTitle.innerText = `検索結果：${classField} [${classVal.toUpperCase()}] (${matchedRows.length}名)`;

      const selectedFields = getSelectedFields();
      if (selectedFields.length === 0) {
        resultContent.innerHTML = `<div style="color:#94a3b8; font-size:0.85rem; text-align:center; padding:10px;">出力する項目が選択されていません。</div>`;
        return;
      }

      const csvBtn = document.createElement('button');
      csvBtn.className = 'action-btn csv-btn copy-btn';
      csvBtn.innerText = '📥 CSVダウンロード';
      csvBtn.onclick = function() {
        downloadCSV(matchedRows, selectedFields, classVal);
      };
      resultActionArea.appendChild(csvBtn);

      const tableContainer = document.createElement('div');
      tableContainer.className = 'table-container';

      const table = document.createElement('table');
      table.className = 'class-table';

      const thead = document.createElement('thead');
      let headerTr = document.createElement('tr');
      selectedFields.forEach(f => {
        let th = document.createElement('th');
        th.innerText = f;
        headerTr.appendChild(th);
      });
      thead.appendChild(headerTr);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      matchedRows.forEach(row => {
        let tr = document.createElement('tr');
        selectedFields.forEach(f => {
          let td = document.createElement('td');
          td.innerText = formatValue(f, row[f]);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      tableContainer.appendChild(table);

      resultContent.appendChild(tableContainer);
    }

    function downloadCSV(rows, fields, className) {
      const csvRows = [];
      csvRows.push(fields.map(f => `"${f.replace(/"/g, '""')}"`).join(','));

      rows.forEach(row => {
        const values = fields.map(f => {
          const val = formatValue(f, row[f]);
          return `"${val.replace(/"/g, '""')}"`;
        });
        csvRows.push(values.join(','));
      });

      const blob = new Blob(['\uFEFF' + csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `student_list_${className}_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
