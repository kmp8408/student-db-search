<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン接続テスト</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1b2e23; color: #fff; max-width: 500px; margin: 0 auto; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #0d9488; color: #fff; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    #msg { margin-top: 15px; padding: 10px; background: #23382c; border-radius: 4px; min-height: 40px; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>

  <h2>🧪 ログイン接続テスト画面</h2>
  <div>
    <label>教員ID</label>
    <input type="text" id="testId" placeholder="教員ID">
    <label>パスワード</label>
    <input type="password" id="testPass" placeholder="パスワード">
    <button type="button" id="testBtn">テスト送信（クリックしてください）</button>
  </div>

  <div id="msg">ここに結果が表示されます。</div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwzbUMOPgQaGan2cK_illXQ8XQZy3Xf4guG_k1O3F6mLCdNWPIDe9-_bvH4qApQ5JbcMA/exec";

    document.getElementById('testBtn').addEventListener('click', function() {
      const id = document.getElementById('testId').value.trim();
      const pass = document.getElementById('testPass').value.trim();
      const msgBox = document.getElementById('msg');

      if (!id || !pass) {
        alert("IDとパスワードを入力してください");
        return;
      }

      msgBox.innerText = "🔄 通信を開始しました...しばらくお待ちください";

      // コールバック関数
      window.testCallback = function(data) {
        alert("受信成功！ success: " + data.success);
        msgBox.innerText = "【受信成功】\n" + JSON.stringify(data).slice(0, 300) + "...";
      };

      const script = document.createElement('script');
      script.src = GAS_URL + "?action=login&id=" + encodeURIComponent(id) + "&pass=" + encodeURIComponent(pass) + "&callback=testCallback&t=" + Date.now();
      script.onerror = function() {
        alert("通信エラーが発生しました");
        msgBox.innerText = "⚠️ スクリプトの読み込み（通信）に失敗しました。";
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
